# Independent unprivileged Nginx process, run by devspace with -p runtime/control/.
worker_processes 1;
pid /srv/devspace/repos/rich4-runtime/control/staging-nginx.pid;
error_log /srv/devspace/repos/rich4-runtime/control/staging-error.log warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format transfer escape=json '{"path":"$uri","status":$status,"bytesSent":$bytes_sent}';
    access_log /srv/devspace/repos/rich4-runtime/control/staging-access.jsonl transfer;
    # Private verifier: the session service delegates to the existing htpasswd.
    server {
        listen 127.0.0.1:18184;
        auth_basic "Rich4 Staging";
        auth_basic_user_file /srv/devspace/repos/rich4-runtime/state/htpasswd;
        access_log off;
        location / { empty_gif; }
    }
    server {
        listen 127.0.0.1:18181;
        server_name rich4-staging.gopeaks.club;
        include /srv/devspace/repos/rich4-runtime/control/staging-rich4.locations.conf;
    }
}

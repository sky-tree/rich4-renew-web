# Rich4 Renew Web — DevSpace Web Gateway route snippet for /rich4/ (M3/M7)
# Target layout on DevSpace VPS:
#   /srv/devspace/repos/rich4-runtime/rich4           -> symlink to /srv/devspace/repos/rich4-runtime/rich4-releases/<release-id>
#   /srv/devspace/repos/rich4-runtime/rich4-releases/ -> immutable versioned release directories
#   /srv/devspace/repos/rich4-runtime/state/htpasswd  -> HTTP Basic Auth credentials for controlled internal beta

location = /rich4 {
    absolute_redirect off;
    return 308 /rich4/;
}

location = /rich4/manifest.webmanifest {
    root /srv/devspace/repos/rich4-runtime;
    auth_basic off;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Service Worker: zero-cache and explicit scope (Issue #3)
location = /rich4/sw.js {
    root /srv/devspace/repos/rich4-runtime;
    auth_basic "Rich4 Renew Web Internal Beta";
    auth_basic_user_file /srv/devspace/repos/rich4-runtime/state/htpasswd;
    add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header Service-Worker-Allowed "/rich4/" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /rich4/ {
    root /srv/devspace/repos/rich4-runtime;
    index index.html;
    try_files $uri $uri/ =404;

    auth_basic "Rich4 Renew Web Internal Beta";
    auth_basic_user_file /srv/devspace/repos/rich4-runtime/state/htpasswd;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;

    # This regex must be nested: the enclosing ^~ skips sibling regex locations.
    # Inherit the full server mime.types table for scripts, styles and fonts.
    location ~* ^/rich4/(favicon\.ico|icons/.*\.(png|svg|ico))$ {
        root /srv/devspace/repos/rich4-runtime;
        auth_basic off;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Entry HTML and release/pack manifests: never cache permanently so updates/rollbacks take effect immediately (Issue #3).
    location ~* ^/rich4/(index\.html|release-manifest\.json|assets/web-packs\.json)$ {
        root /srv/devspace/repos/rich4-runtime;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Content-hashed JS, CSS and font bundles generated by Vite: immutable 1-year cache.
    location ~* ^/rich4/assets/((index|core-engine|ui-screens|vendor-peer|zh-hans)-[A-Za-z0-9_-]+\.(js|css)|huninn-.*\.(woff2?|ttf))$ {
        root /srv/devspace/repos/rich4-runtime;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Game art, audio and map JSONs (restricted private assets):
    # Strictly marked 'private, no-transform' to prevent Cloudflare and shared reverse-proxy caching (Issue #4).
    location ~* ^/rich4/assets/.*\.(webp|png|json|m4a)$ {
        root /srv/devspace/repos/rich4-runtime;
        add_header Cache-Control "private, no-transform, max-age=86400, must-revalidate" always;
        add_header Vary "Authorization, Accept-Encoding" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}

# Rich4 Renew Web — Nginx static deployment snippet for /rich4/ (M3/M7)
# Include inside the existing HTTPS `server` block (e.g. apps.gopeaks.club).
# Target layout:
#   /srv/www/apps/rich4           -> symlink to /srv/www/apps/rich4-releases/<release-id>
#   /srv/www/apps/rich4-releases/ -> immutable versioned release directories

location = /rich4 {
    return 301 /rich4/;
}

location ^~ /rich4/ {
    root /srv/www/apps;
    index index.html;
    try_files $uri $uri/ =404;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Preserve the server's full mime.types table for JS/CSS/fonts.
    location = /rich4/manifest.webmanifest {
        root /srv/www/apps;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Public standalone App Shell icons & favicon (Issue #2)
    location ~* ^/rich4/(favicon\.ico|icons/.*\.(png|svg|ico))$ {
        root /srv/www/apps;
        auth_basic off;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Entry HTML, release/pack manifests and Service Worker: never cache permanently so updates/rollbacks take effect immediately (Issue #3)
    location ~* ^/rich4/(index\.html|release-manifest\.json|manifest\.webmanifest|assets/web-packs\.json)$ {
        root /srv/www/apps;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Service Worker: explicit zero-cache and scope authorization header (Issue #3)
    location = /rich4/sw.js {
        root /srv/www/apps;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Service-Worker-Allowed "/rich4/" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Content-hashed JS, CSS and font bundles generated by Vite: immutable 1-year cache.
    location ~* ^/rich4/assets/((index|core-engine|ui-screens|vendor-peer|zh-hans)-[A-Za-z0-9_-]+\.(js|css)|huninn-.*\.(woff2?|ttf))$ {
        root /srv/www/apps;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Game art, audio and map JSONs (restricted private assets):
    # Strictly marked 'private, no-transform' to prevent Cloudflare and shared reverse-proxy caching (Issue #4).
    location ~* ^/rich4/assets/.*\.(webp|png|json|m4a)$ {
        root /srv/www/apps;
        add_header Cache-Control "private, no-transform, max-age=86400, must-revalidate" always;
        add_header Vary "Authorization, Accept-Encoding" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}

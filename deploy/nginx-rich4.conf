# Rich4 Renew Web — Nginx static deployment snippet for /rich4/ (M3)
# Include inside the existing HTTPS `server` block (e.g. apps.gopeaks.club).
# Target layout:
#   /srv/www/apps/rich4           -> symlink to /srv/www/apps/rich4-releases/<release-id>
#   /srv/www/apps/rich4-releases/ -> immutable versioned release directories

location = /rich4 {
    return 301 /rich4/;
}

location ^~ /rich4/ {
    root /srv/www/apps;
    index index.html;
    try_files $uri $uri/ =404;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Entry HTML and release/pack manifests: never cache permanently so updates/rollbacks take effect immediately.
    location ~* ^/rich4/(index\.html|release-manifest\.json|manifest\.webmanifest|sw\.js|assets/web-packs\.json)$ {
        root /srv/www/apps;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Content-hashed JS, CSS and font bundles generated by Vite: immutable 1-year cache.
    location ~* ^/rich4/assets/((index|core-engine|ui-screens|vendor-peer|zh-hans)-[A-Za-z0-9_-]+\.(js|css)|huninn-.*\.(woff2?|ttf))$ {
        root /srv/www/apps;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Game art, audio and map JSONs: revalidate with ETag / Last-Modified.
    location ~* ^/rich4/assets/.*\.(webp|png|json|m4a)$ {
        root /srv/www/apps;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}

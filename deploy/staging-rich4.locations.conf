# Include inside the isolated staging server (not the production /rich4/ route).
root /srv/devspace/repos/rich4-runtime/rich4-staging;
index index.html;
auth_request /_rich4_auth;
auth_request_set $staging_cookie $upstream_http_set_cookie;
add_header Set-Cookie $staging_cookie always;
error_page 401 =401 /api/session;
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/json application/javascript application/manifest+json image/svg+xml;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

location / { try_files $uri $uri/ =404; }
location = /_rich4_auth {
    internal;
    auth_request off;
    proxy_pass http://127.0.0.1:18182/api/session-check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
}
location = /api/session {
    auth_request off;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:18182;
    add_header Cache-Control "private, no-store" always;
}
location = /api/party-config {
    proxy_pass http://127.0.0.1:18182;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Set-Cookie $staging_cookie always;
}
location ^~ /peerjs/ {
    proxy_pass http://127.0.0.1:18183;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    add_header Cache-Control "private, no-store" always;
    add_header Set-Cookie $staging_cookie always;
}
location = /manifest.webmanifest {
    auth_basic off;
    auth_request off;
    default_type application/manifest+json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
    add_header Service-Worker-Allowed "/" always;
    add_header X-Content-Type-Options nosniff always;
}
location ~* ^/(favicon\.ico|icons/.*\.(png|svg|ico))$ {
    auth_basic off;
    auth_request off;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options nosniff always;
}
location ~* ^/(index\.html|release-manifest\.json|assets/web-packs\.json)$ {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Set-Cookie $staging_cookie always;
}
location ~* ^/assets/((index|core-engine|ui-screens|vendor-peer|zh-hans)-[A-Za-z0-9_-]+\.(js|css)|huninn-.*\.(woff2?|ttf))$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
}
location ~* ^/assets/.*\.(webp|png|json|m4a)$ {
    add_header Cache-Control "private, no-transform, max-age=86400, must-revalidate" always;
    add_header Vary "Authorization, Cookie, Accept-Encoding" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Set-Cookie $staging_cookie always;
}
location ~ /\. { deny all; }

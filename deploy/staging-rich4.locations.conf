# Include inside the isolated staging server (not the production /rich4/ route).
root /srv/devspace/repos/rich4-runtime/rich4-staging;
index index.html;
auth_basic "Rich4 Staging";
auth_basic_user_file /srv/devspace/repos/rich4-runtime/state/htpasswd;
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/json application/javascript application/manifest+json image/svg+xml;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

location / { try_files $uri $uri/ =404; }
location = /manifest.webmanifest {
    auth_basic off;
    default_type application/manifest+json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
    add_header Service-Worker-Allowed "/" always;
    add_header X-Content-Type-Options nosniff always;
}
location ~* ^/(favicon\.ico|icons/.*\.(png|svg|ico))$ {
    auth_basic off;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options nosniff always;
}
location ~* ^/(index\.html|release-manifest\.json|assets/web-packs\.json)$ {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
location ~* ^/assets/((index|core-engine|ui-screens|vendor-peer|zh-hans)-[A-Za-z0-9_-]+\.(js|css)|huninn-.*\.(woff2?|ttf))$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
}
location ~* ^/assets/.*\.(webp|png|json|m4a)$ {
    add_header Cache-Control "private, no-transform, max-age=86400, must-revalidate" always;
    add_header Vary "Authorization, Accept-Encoding" always;
    add_header X-Content-Type-Options nosniff always;
}
location ~ /\. { deny all; }

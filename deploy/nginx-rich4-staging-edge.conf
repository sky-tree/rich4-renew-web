# Add as a separate site only after issuing this host's webroot TLS certificate.
server {
    listen 80;
    listen [::]:80;
    server_name rich4-staging.gopeaks.club;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rich4-staging.gopeaks.club;
    ssl_certificate /etc/letsencrypt/live/rich4-staging.gopeaks.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rich4-staging.gopeaks.club/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:18181;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache off;
    }
}

name: Rich4 Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-code:
    name: TypeScript, Vitest, E2E Smoke & Code-Only Web Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: game/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Run TypeScript type check
        run: |
          npx tsc --noEmit
          npx tsc --noEmit -p tsconfig.e2e.json

      - name: Install and test real Nginx routing, MIME and authentication
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          npm run test:nginx

      - name: Run unit & security regression tests (asset-free mode)
        run: |
          npm test
          node --test ../deploy/party-runtime/config.test.mjs
          node --test ../deploy/party-runtime/session.test.mjs

      - name: Build Web bundle (--base=/rich4/, RICH4_NO_ASSETS=1)
        env:
          RICH4_NO_ASSETS: '1'
        run: npm run build:web

      - name: Verify Web bundle & PWA App Shell (code-only mode)
        run: npm run verify:web:code

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E smoke tests (code-only mode)
        run: npm run test:e2e:code

      - name: Upload Playwright failure evidence (on failure only)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-e2e-evidence
          path: game/test-results/
          retention-days: 7
